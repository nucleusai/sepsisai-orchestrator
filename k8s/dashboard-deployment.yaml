apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: sepsisai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      containers:
        - name: dashboard
          image: sepsisai/dashboard:latest
          ports:
            - containerPort: 8501
          envFrom:
            - configMapRef:
                name: sepsisai-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: 8501
            initialDelaySeconds: 10
            periodSeconds: 30
